<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Nema veze</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #09090b;
        color: #ededf0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
      }
      p {
        color: #a1a1aa;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        height: 52px;
        padding: 0 28px;
        border-radius: 14px;
        border: 1px solid #28282e;
        background: #1a1a1e;
        color: #ededf0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M2 8.8a15 15 0 0 1 20 0M5 12.9a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M3 3l18 18" />
      </svg>
      <h1>Nema internetske veze</h1>
      <p>Ništa nije izgubljeno. Kad se signal vrati, stranica se učitava ponovno.</p>
      <button type="button" onclick="location.reload()">Pokušaj ponovno</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
